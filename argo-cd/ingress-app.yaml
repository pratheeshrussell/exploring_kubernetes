apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-app
spec:
  destination:
    namespace: ingress-nginx
    server: https://kubernetes.default.svc
  source:
    path: k8s/ingress
    repoURL: https://github.com/pratheeshrussell/exploring_kubernetes
    targetRevision: argo-cd-setup
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true