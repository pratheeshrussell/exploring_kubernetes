apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-operator
spec:
  destination:
    namespace: pg-operator
    server: https://kubernetes.default.svc
  source:
    path: k8s/operators
    repoURL: https://github.com/pratheeshrussell/exploring_kubernetes
    targetRevision: argo-cd-setup
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true