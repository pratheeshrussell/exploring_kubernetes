apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: ingress-nginx
    server: https://kubernetes.default.svc
  source:
    path: k8s/platform-services/ingress
    repoURL: https://github.com/pratheeshrussell/exploring_kubernetes
    targetRevision: crossplane-setup
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true