apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quotes-app
spec:
  destination:
    namespace: demo-app
    server: https://kubernetes.default.svc
  source:
    path: k8s/overlays/local
    repoURL: https://github.com/pratheeshrussell/exploring_kubernetes
    targetRevision: argo-cd-setup
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true