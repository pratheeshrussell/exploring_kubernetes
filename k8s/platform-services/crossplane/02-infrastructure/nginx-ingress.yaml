apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: kube-ingress-nginx
spec:
  forProvider:
    chart:
      name: ingress-nginx
      repository: https://kubernetes.github.io/ingress-nginx
      version: 4.15.1
    namespace: ingress-nginx
    values:
      controller:
        hostPort:
          enabled: true
        service:
          type: NodePort
        ingressClassResource:
          default: true
  providerConfigRef:
    name: default
